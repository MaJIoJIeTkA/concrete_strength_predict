<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прочность бетона</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 40px; }
        .box { max-width: 450px; background: white; padding: 25px; border-radius: 8px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 3px; }
        input { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; background: #007BFF; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0056b3; }
        .res { margin-top: 15px; padding: 12px; background: #e2f0d9; text-align: center; border-radius: 4px; font-weight: bold; color: #385723; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center;">Анализ прочности бетона</h2>
        <form method="post">
            <div class="group"><label>Цемент:</label><input type="number" step="any" name="cement" value="540.0" required></div>
            <div class="group"><label>Шлак:</label><input type="number" step="any" name="slag" value="0.0" required></div>
            <div class="group"><label>Зола:</label><input type="number" step="any" name="ash" value="0.0" required></div>
            <div class="group"><label>Вода:</label><input type="number" step="any" name="water" value="162.0" required></div>
            <div class="group"><label>Суперпластификатор:</label><input type="number" step="any" name="superplasticizer" value="2.5" required></div>
            <div class="group"><label>Крупный заполнитель:</label><input type="number" step="any" name="coarse_agg" value="1040.0" required></div>
            <div class="group"><label>Мелкий заполнитель:</label><input type="number" step="any" name="fine_agg" value="676.0" required></div>
            <div class="group"><label>Возраст (дни):</label><input type="number" step="any" name="age" value="28" required></div>
            <button type="submit">Рассчитать</button>
        </form>
        {% if prediction is not none %}
        <div class="res">Прогноз прочности: {{ prediction }} МПа</div>
        {% endif %}
    </div>
</body>
</html>
